name: Fetch RSS articles

on:
  schedule:
    - cron: '0 6 * * 1'  # Lundi 8h00 heure de Paris (6h UTC)
  workflow_dispatch:      # Déclenchement manuel possible

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.essai1.outputs.page_url || steps.essai2.outputs.page_url || steps.essai3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch RSS feeds
        run: node scripts/fetch-rss.mjs

      - name: Commit articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/articles.json
          git diff --staged --quiet || git commit -m "chore: mise à jour articles RSS $(date -u +%Y-%m-%d)"

      - name: Push
        run: git push

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Juste après son dépôt, l'artefact peut rester invisible quelques secondes
      # (jusqu'à ~1 min observé, très fréquent depuis le 22/11/2026) : deploy-pages
      # échoue alors sans réessayer, et relancer le job ne sert à rien puisqu'il
      # dépose un second artefact. D'où trois tentatives espacées.
      # Suivi : https://github.com/actions/deploy-pages/issues/451
      - name: Laisser l'artefact devenir visible
        run: sleep 5

      - uses: actions/deploy-pages@v5
        id: essai1
        continue-on-error: true

      - name: Attendre avant la 2e tentative
        if: steps.essai1.outcome == 'failure'
        run: sleep 20

      - uses: actions/deploy-pages@v5
        id: essai2
        if: steps.essai1.outcome == 'failure'
        continue-on-error: true

      - name: Attendre avant la 3e tentative
        if: steps.essai1.outcome == 'failure' && steps.essai2.outcome == 'failure'
        run: sleep 60

      - uses: actions/deploy-pages@v5
        id: essai3
        if: steps.essai1.outcome == 'failure' && steps.essai2.outcome == 'failure'
